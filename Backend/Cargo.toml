[package]
name = "Backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.51.0", features = [ "full" ]}
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
tower-http = { version = "0.6.6", features = [ "cors" ] }
http = "1.4.0"
reqwest = { version = "0.13.2", features = ["json"] }
serde_urlencoded = "0.7"
dotenvy = "0.15.7"
uuid = { version = "1.23.0", features = ["v4"] }
tower-cookies = "0.11.0"
chrono = "0.4.44"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
prost = "0.13"
prost-types = "0.13"
bytes = "1"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
hmac = "0.12"
sha1 = "0.10"
sqlx = { version = "0.9.0", features = [ "sqlite", "runtime-tokio", "derive" ] }

[build-dependencies]
prost-build = "0.13"
